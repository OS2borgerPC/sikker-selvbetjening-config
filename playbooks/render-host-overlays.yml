# Render one normalized configuration overlay payload for a selected build target.
#
# This playbook is called by the build script with:
# - target_domain: the domain containing the selected build target
# - target_name: the selected build target name
# - build_name: the output folder name under build/
#
# What it does:
# 1) load the combined config from config/config.yml
# 2) resolve the requested domain and build target
# 3) resolve the ordered groups attached to that build target
# 4) merge the selected groups in order into one combined configuration overlay
# 5) write build/<build_name>/configuration-overlay.normalized.json for later image build

- name: Render config overlay per build target
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Validate target_domain input
      assert:
        that:
          - target_domain is defined
          - target_domain | length > 0
        fail_msg: "target_domain must be provided"

    - name: Validate target_name input
      assert:
        that:
          - target_name is defined
          - target_name | length > 0
        fail_msg: "target_name must be provided"

    - name: Load combined config/config.yml
      include_vars:
        file: "../config/config.yml"
        name: all_groups_data

    - name: Select domain from combined config
      set_fact:
        selected_domain: "{{ (all_groups_data.domains | default([]) | selectattr('domain', 'equalto', target_domain) | list | first) | default({}) }}"

    - name: Validate selected domain exists in combined config
      assert:
        that:
          - selected_domain.domain is defined
        fail_msg: "Domain '{{ target_domain }}' not found in config/config.yml combined config"

    - name: Select build target from combined config
      set_fact:
        selected_build_target: "{{ (selected_domain.build_targets | default([]) | selectattr('name', 'equalto', target_name) | list | first) | default({}) }}"

    - name: Validate selected build target exists in combined config
      assert:
        that:
          - selected_build_target.name is defined
        fail_msg: "Build target '{{ target_name }}' not found in domain '{{ target_domain }}' in config/config.yml"

    - name: Set ordered target groups from selected build target
      set_fact:
        normalized_target_groups: "{{ selected_build_target.groups }}"

    - name: Build group lookup by name within domain
      set_fact:
        groups_by_name: "{{ dict((selected_domain.groups | default([])) | map(attribute='name') | zip((selected_domain.groups | default([])))) }}"

    - name: Validate all target groups exist in selected domain
      assert:
        that:
          - item in groups_by_name
        fail_msg: "Group '{{ item }}' not found in domain '{{ target_domain }}' in config/config.yml combined config"
      loop: "{{ normalized_target_groups }}"

    - name: Initialize merged configuration overlay sections
      set_fact:
        configuration_overlay_sections: {}

    - name: Merge configuration overlay sections in group order
      set_fact:
        configuration_overlay_sections: >-
          {{ configuration_overlay_sections | combine(
               groups_by_name[item] | dict2items | rejectattr('key', 'equalto', 'name') | items2dict,
               recursive=True) }}
      loop: "{{ normalized_target_groups }}"

    - name: Set build root path
      set_fact:
        build_root: "{{ playbook_dir }}/../build/{{ build_name }}"

  tasks:
    - name: Create build root
      file:
        path: "{{ build_root }}"
        state: directory
        recurse: true

    - name: Emit normalized configuration overlay payload for base image helpers
      copy:
        dest: "{{ build_root }}/configuration-overlay.normalized.json"
        content: "{{ configuration_overlay_sections | to_nice_json }}\n"
