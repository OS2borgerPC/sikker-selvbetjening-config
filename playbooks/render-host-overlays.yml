# Render one normalized configuration overlay payload for a selected device group.
#
# This playbook is called by the build script with:
# - device_group_domain: the domain containing the selected device group
# - device_group_name: the selected device group name
# - build_name: the output folder name under build/
#
# What it does:
# 1) load the combined config from config/config.yml
# 2) resolve the requested domain and device group
# 3) resolve the ordered policies attached to that device group
# 4) merge the selected policies in order into one combined configuration overlay
# 5) write build/<build_name>/configuration-overlay.normalized.json for later image build

- name: Render config overlay per device group
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Validate device group domain input
      assert:
        that:
          - device_group_domain is defined
          - device_group_domain | length > 0
        fail_msg: "device_group_domain must be provided"

    - name: Validate device_group_name input
      assert:
        that:
          - device_group_name is defined
          - device_group_name | length > 0
        fail_msg: "device_group_name must be provided"

    - name: Load combined config/config.yml
      include_vars:
        file: "../config/config.yml"
        name: all_config_data

    - name: Select domain from combined config
      set_fact:
        selected_domain: "{{ (all_config_data.domains | default([]) | selectattr('domain', 'equalto', device_group_domain) | list | first) | default({}) }}"

    - name: Validate selected domain exists in combined config
      assert:
        that:
          - selected_domain.domain is defined
        fail_msg: "Domain '{{ device_group_domain }}' not found in config/config.yml combined config"

    - name: Select device group from combined config
      set_fact:
        selected_device_group: "{{ (selected_domain.device_groups | default([]) | selectattr('name', 'equalto', device_group_name) | list | first) | default({}) }}"

    - name: Validate selected device group exists in combined config
      assert:
        that:
          - selected_device_group.name is defined
        fail_msg: "Device group '{{ device_group_name }}' not found in domain '{{ device_group_domain }}' in config/config.yml"

    - name: Set ordered policies from selected device group
      set_fact:
        normalized_device_group_policies: "{{ selected_device_group.policies }}"

    - name: Build policy lookup by name within domain
      set_fact:
        policies_by_name: "{{ dict((selected_domain.policies | default([])) | map(attribute='name') | zip((selected_domain.policies | default([])))) }}"

    - name: Validate all device group policies exist in selected domain
      assert:
        that:
          - item in policies_by_name
        fail_msg: "Policy '{{ item }}' not found in domain '{{ device_group_domain }}' in config/config.yml combined config"
      loop: "{{ normalized_device_group_policies }}"

    - name: Initialize merged configuration overlay sections
      set_fact:
        configuration_overlay_sections: {}

    - name: Merge configuration overlay sections in policy order
      set_fact:
        configuration_overlay_sections: >-
          {{ configuration_overlay_sections | combine(
               policies_by_name[item] | dict2items | rejectattr('key', 'equalto', 'name') | items2dict,
               recursive=True) }}
      loop: "{{ normalized_device_group_policies }}"

    - name: Set build root path
      set_fact:
        build_root: "{{ playbook_dir }}/../build/{{ build_name }}"

  tasks:
    - name: Create build root
      file:
        path: "{{ build_root }}"
        state: directory
        recurse: true

    - name: Emit combined configuration pr. build taget to be consumed by base-image playbooks
      copy:
        dest: "{{ build_root }}/configuration-overlay.json"
        content: "{{ configuration_overlay_sections | to_nice_json }}\n"
