# Render one normalized configuration overlay payload from one imageconfig file.
#
# This playbook is called by the build script with:
# - imageconfig_file: repository-relative path to imageconfig YAML
# - build_name: the output folder name under build/
#
# What it does:
# 1) load selected imageconfig file
# 2) resolve the ordered policy files listed in that imageconfig
# 3) merge policy content in listed order into one configuration overlay
# 4) write build/<build_name>/configuration-overlay.json for later image build

- name: Render config overlay per device group
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Validate imageconfig file input
      assert:
        that:
          - imageconfig_file is defined
          - imageconfig_file | length > 0
        fail_msg: "imageconfig_file must be provided"

    - name: Validate build name input
      assert:
        that:
          - build_name is defined
          - build_name | length > 0
        fail_msg: "build_name must be provided"

    - name: Set imageconfig absolute path
      set_fact:
        imageconfig_abs_path: "{{ playbook_dir }}/../{{ imageconfig_file }}"

    - name: Validate imageconfig file exists
      stat:
        path: "{{ imageconfig_abs_path }}"
      register: imageconfig_stat

    - name: Fail when imageconfig file is missing
      assert:
        that:
          - imageconfig_stat.stat.exists
          - imageconfig_stat.stat.isreg
        fail_msg: "Imageconfig file '{{ imageconfig_file }}' not found"

    - name: Load selected imageconfig file
      include_vars:
        file: "{{ imageconfig_abs_path }}"
        name: imageconfig_data

    - name: Validate imageconfig policy list
      assert:
        that:
          - imageconfig_data.policies is defined
          - imageconfig_data.policies | type_debug == 'list'
          - imageconfig_data.policies | length > 0
        fail_msg: "imageconfig '{{ imageconfig_file }}' must contain a non-empty policies list"

    - name: Set imageconfig directory
      set_fact:
        imageconfig_dir: "{{ imageconfig_abs_path | dirname }}"

    - name: Resolve policy file paths
      set_fact:
        policy_files: "{{ (policy_files | default([])) + [ (item if (item is match('^/')) else (imageconfig_dir ~ '/' ~ item)) ] }}"
      loop: "{{ imageconfig_data.policies }}"

    - name: Validate policy files exist
      stat:
        path: "{{ item }}"
      register: policy_file_stats
      loop: "{{ policy_files }}"

    - name: Fail when any policy file is missing
      assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Policy file '{{ item.item }}' referenced by imageconfig '{{ imageconfig_file }}' does not exist"
      loop: "{{ policy_file_stats.results }}"

    - name: Initialize merged configuration overlay sections
      set_fact:
        configuration_overlay_sections: {}

    - name: Merge configuration overlay sections in imageconfig policy order
      set_fact:
        configuration_overlay_sections: >-
          {{ configuration_overlay_sections | combine(
               (lookup('file', item) | from_yaml) | dict2items | rejectattr('key', 'equalto', 'name') | rejectattr('key', 'equalto', 'id') | items2dict,
               recursive=True) }}
      loop: "{{ policy_files }}"

    - name: Set build root path
      set_fact:
        build_root: "{{ playbook_dir }}/../build/{{ build_name }}"

  tasks:
    - name: Create build root
      file:
        path: "{{ build_root }}"
        state: directory
        recurse: true

    - name: Emit combined configuration pr. build taget to be consumed by base-image playbooks
      copy:
        dest: "{{ build_root }}/configuration-overlay.json"
        content: "{{ configuration_overlay_sections | to_nice_json }}\n"
