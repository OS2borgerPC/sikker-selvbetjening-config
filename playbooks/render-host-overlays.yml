- name: Render config overlay per build target
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Validate target_domain input
      assert:
        that:
          - target_domain is defined
          - target_domain | length > 0
        fail_msg: "target_domain must be provided"

    - name: Validate target_groups input
      assert:
        that:
          - target_groups is defined
          - target_groups | length > 0
        fail_msg: "target_groups must be provided"

    - name: Normalize target groups list
      set_fact:
        normalized_target_groups: "{{ target_groups.split(',') if target_groups is string else target_groups }}"

    - name: Load combined config/config.yml
      include_vars:
        file: "../config/config.yml"
        name: all_groups_data

    - name: Select domain from combined config
      set_fact:
        selected_domain: "{{ (all_groups_data.domains | default([]) | selectattr('domain', 'equalto', target_domain) | list | first) | default({}) }}"

    - name: Validate selected domain exists in combined config
      assert:
        that:
          - selected_domain.domain is defined
        fail_msg: "Domain '{{ target_domain }}' not found in config/config.yml combined config"

    - name: Build group lookup by name within domain
      set_fact:
        groups_by_name: "{{ dict((selected_domain.groups | default([])) | map(attribute='name') | zip((selected_domain.groups | default([])))) }}"

    - name: Validate all target groups exist in selected domain
      assert:
        that:
          - item in groups_by_name
        fail_msg: "Group '{{ item }}' not found in domain '{{ target_domain }}' in config/config.yml combined config"
      loop: "{{ normalized_target_groups }}"

    - name: Initialize merged overlay sections
      set_fact:
        overlay_sections: {}

    - name: Merge overlay sections in group order
      set_fact:
        overlay_sections: >-
          {{ overlay_sections | combine(
               groups_by_name[item] | dict2items | rejectattr('key', 'equalto', 'name') | items2dict,
               recursive=True) }}
      loop: "{{ normalized_target_groups }}"

    - name: Set build root path
      set_fact:
        build_root: "{{ playbook_dir }}/../build/{{ build_name }}"

    - name: Normalize overlay data and validate assets path values
      shell: |
        python3 - <<'PY'
        import json
        import os
        import posixpath
        import sys

        data = json.loads(os.environ["OVERLAY_JSON"])

        def normalize(value):
            if isinstance(value, dict):
                normalized = {}
                for key, subvalue in value.items():
                    normalized_value = normalize(subvalue)
                    normalized[key] = normalized_value
                return normalized

            if isinstance(value, list):
                return [normalize(item) for item in value]

            if isinstance(value, str) and value.startswith("assets/"):
                rel_path = posixpath.normpath(value[7:])

                if rel_path in (".", "") or rel_path.startswith("../") or "/../" in rel_path:
                    raise ValueError(f"Asset path escapes assets root: {value}")

                return f"assets/{rel_path}"

            return value

        try:
            normalized_overlay = normalize(data)
        except ValueError as exc:
            print(str(exc), file=sys.stderr)
            raise SystemExit(1)

        print(
            json.dumps(
                {
                    "rendered_overlay_sections": normalized_overlay,
                }
            )
        )
        PY
      args:
        executable: /bin/bash
      environment:
        OVERLAY_JSON: "{{ overlay_sections | to_json }}"
      register: overlay_processing
      changed_when: false

    - name: Parse normalized overlay payload
      set_fact:
        overlay_processing_data: "{{ overlay_processing.stdout | from_json }}"

    - name: Set rendered overlay sections
      set_fact:
        rendered_overlay_sections: "{{ overlay_processing_data.rendered_overlay_sections }}"

  tasks:
    - name: Create build root
      file:
        path: "{{ build_root }}"
        state: directory
        recurse: true

    - name: Emit normalized overlay payload for base image helpers
      copy:
        dest: "{{ build_root }}/overlay.normalized.json"
        content: "{{ rendered_overlay_sections | to_nice_json }}\n"
