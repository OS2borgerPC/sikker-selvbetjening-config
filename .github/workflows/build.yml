name: Build device group images

on:
  workflow_dispatch:

env:
  # Base container image used for schema validation and as build FROM image.
  BASE_IMAGE: ghcr.io/os2borgerpc/sikker-selvbetjening:latest
  # Absolute path in BASE_IMAGE where validation schemas are stored.
  BASE_IMAGE_SCHEMA_PATH: /usr/share/sikker-selvbetjening/schemas/schema.json
  # Registry/repository prefix where derived device group images are tagged and pushed.
  IMAGE_REPO: ghcr.io/os2borgerpc/sikker-selvbetjening-config

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: pip install pyyaml jsonschema

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Export schema from base image
        run: |
          set -euo pipefail
          container_id="$(podman create "$BASE_IMAGE")"
          cleanup() {
            podman rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          mkdir -p .ci
          podman cp "${container_id}:${BASE_IMAGE_SCHEMA_PATH}" .ci/schema.json


      - name: Validate config.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          import jsonschema
          import yaml

          schema_path = pathlib.Path('.ci/schema.json')
          config_path = pathlib.Path('config/config.yml')

          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          config = yaml.safe_load(config_path.read_text(encoding='utf-8'))

          jsonschema.validate(instance=config, schema=schema)
          print(f"Validation passed for {config_path} against {schema_path}")
          PY
     

      - name: Discover device groups
        id: discover
        run: |
          python3 ./scripts/discover-device-groups.py >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    name: Build ${{ matrix.name }}
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install ansible
        run: pip install ansible

      - name: Render and build
        run: ./scripts/build-device-group-image.sh "${{ matrix.device_group_name }}" "${{ matrix.image }}" "${{ matrix.domain }}"
