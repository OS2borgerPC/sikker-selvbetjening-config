name: Build group config images

on:
  workflow_dispatch:

env:
  # Base container image used for schema validation and as build FROM image.
  BASE_IMAGE: ghcr.io/os2borgerpc/sikker-selvbetjening:latest
  # Registry/repository prefix where derived group images are tagged and pushed.
  IMAGE_REPO: ghcr.io/os2borgerpc/sikker-selvbetjening-config

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: pip install pyyaml jsonschema

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Export schema from base image
        run: |
          mkdir -p .ci
          podman run --rm "${BASE_IMAGE}" sh -lc '
            set -eu
            schema_path="$(find / -type f -name schema.json 2>/dev/null | head -n 1)"
            if [ -z "${schema_path}" ]; then
              echo "ERROR: no schema.json found in ${BASE_IMAGE}" >&2
              exit 1
            fi
            echo "Using schema path: ${schema_path}" >&2
            cat "${schema_path}"
          ' > .ci/schema.json

      - name: Validate config schema
        run: python3 ./scripts/validate-config.py --schema-file .ci/schema.json

      - name: Discover build targets
        id: discover
        run: |
          python3 ./scripts/discover-build-targets.py >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    name: Build ${{ matrix.name }}
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install ansible
        run: pip install ansible

      - name: Render and build
        run: ./scripts/build-target-image.sh "${{ matrix.target_name }}" "${{ matrix.image }}" "${{ matrix.domain }}"
