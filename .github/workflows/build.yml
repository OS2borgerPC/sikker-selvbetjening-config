name: Build group config images

on:
  workflow_dispatch:

env:
  # Base container image used for schema validation and as build FROM image.
  BASE_IMAGE: ghcr.io/os2borgerpc/sikker-selvbetjening:latest
  # Registry/repository prefix where derived group images are tagged and pushed.
  IMAGE_REPO: ghcr.io/os2borgerpc/sikker-selvbetjening-config

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: pip install pyyaml jsonschema

      - name: Validate config schema
        run: python3 ./scripts/validate-config.py

      - name: Discover build targets
        id: discover
        run: |
          python3 ./scripts/discover-build-targets.py >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    name: Build ${{ matrix.name }}
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install ansible
        run: pip install ansible

      - name: Render and build
        run: ./scripts/build-group-image.sh "${{ matrix.groups_csv }}" "${{ matrix.image }}" "${{ matrix.domain }}"
