name: Build and Push Tenant Images

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Optional tenant name (for example bibliotek)
        required: false
        type: string
      imageconfig_file:
        description: Optional imageconfig filename (for example boernebibliotek.yml)
        required: false
        type: string

env:
  # Base container image used for schema validation and as build FROM image.
  BASE_IMAGE: ghcr.io/os2borgerpc/sikker-selvbetjening:latest
  # Registry/repository prefix where derived images are tagged and pushed.
  # Uses the current repository owner/name so template copies publish to their
  # own GHCR namespace.
  IMAGE_REPO: ghcr.io/${{ github.repository }}

  # Directories under config/ where imageconfigs, assets and policies are located.
  CONFIGS_DIR: config
  IMAGECONFIGS_DIR: imageconfigs
  ASSETS_DIR: assets
  POLICIES_DIR: policies

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install ansible pyyaml

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Discover tenants and imageconfigs
        id: discover_tenants_and_imageconfigs
        run: |
          set -euo pipefail

          # Optional workflow input to narrow processing to one tenant.
          requested_tenant="${{ inputs.tenant }}"
          # Optional workflow input to narrow processing to one imageconfig file.
          requested_imageconfig_file="${{ inputs.imageconfig_file }}"

          # Discover tenant directories directly below CONFIGS_DIR.
          mapfile -t tenant_dirs < <(find "${CONFIGS_DIR}" -mindepth 1 -maxdepth 1 -type d | sort)

          if [[ "${#tenant_dirs[@]}" -eq 0 ]]; then
            echo "No tenant folders found under ${CONFIGS_DIR}/" >&2
            exit 1
          fi

          # Keep only folder names (without CONFIGS_DIR prefix).
          tenants=()
          for tenant_dir in "${tenant_dirs[@]}"; do
            tenants+=("$(basename "${tenant_dir}")")
          done

          if [[ -n "${requested_tenant}" ]]; then
            # Validate requested tenant exists in discovered tenant names.
            tenant_found="no"
            for tenant in "${tenants[@]}"; do
              if [[ "${tenant}" == "${requested_tenant}" ]]; then
                tenant_found="yes"
                break
              fi
            done

            if [[ "${tenant_found}" != "yes" ]]; then
              echo "Requested tenant not found: ${requested_tenant}" >&2
              exit 1
            fi

            # Reduce the tenant list to the requested tenant only.
            tenants=("${requested_tenant}")
          fi

          # Discover imageconfig files for selected tenants.
          imageconfig_pairs=()
          for tenant in "${tenants[@]}"; do
            imageconfigs_dir="${CONFIGS_DIR}/${tenant}/${IMAGECONFIGS_DIR}"

            if [[ ! -d "${imageconfigs_dir}" ]]; then
              continue
            fi

            if [[ -n "${requested_imageconfig_file}" ]]; then
              if [[ -f "${requested_imageconfig_file}" ]]; then
                if [[ "${requested_imageconfig_file}" == "${imageconfigs_dir}/"* ]]; then
                  imageconfig_pairs+=("${tenant}|${requested_imageconfig_file}")
                fi
              else
                mapfile -t tenant_imageconfigs < <(find "${imageconfigs_dir}" -mindepth 1 -maxdepth 1 -type f -name "${requested_imageconfig_file}" | sort)
                for imageconfig in "${tenant_imageconfigs[@]}"; do
                  imageconfig_pairs+=("${tenant}|${imageconfig}")
                done
              fi
            else
              mapfile -t tenant_imageconfigs < <(find "${imageconfigs_dir}" -mindepth 1 -maxdepth 1 -type f -name '*.yml' | sort)
              for imageconfig in "${tenant_imageconfigs[@]}"; do
                imageconfig_pairs+=("${tenant}|${imageconfig}")
              done
            fi
          done

          if [[ "${#imageconfig_pairs[@]}" -eq 0 ]]; then
            echo "No imageconfig files found for selected tenant/imageconfig filters" >&2
            exit 1
          fi

          # Export tenant-imageconfig pairs as JSON for later steps.
          imageconfig_pairs_json="$(python3 - <<'PY' "${imageconfig_pairs[@]}"
          import json
          import sys

          pairs = []
          for raw in sys.argv[1:]:
              tenant, imageconfig = raw.split("|", 1)
              pairs.append({"tenant": tenant, "imageconfig": imageconfig})

          print(json.dumps(pairs))
          PY
          )"
          echo "imageconfig_pairs_json=${imageconfig_pairs_json}" >> "$GITHUB_OUTPUT"

          # Print discovered/selected tenants in the run summary.
          echo "Discovered tenants:" >> "$GITHUB_STEP_SUMMARY"
          for tenant in "${tenants[@]}"; do
            echo "- ${tenant}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo >> "$GITHUB_STEP_SUMMARY"

          echo "Discovered imageconfigs:" >> "$GITHUB_STEP_SUMMARY"
          for pair in "${imageconfig_pairs[@]}"; do
            tenant="${pair%%|*}"
            imageconfig="${pair#*|}"
            echo "- ${tenant}: ${imageconfig}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push tenant imageconfigs
        env:
          IMAGECONFIG_PAIRS_JSON: ${{ steps.discover_tenants_and_imageconfigs.outputs.imageconfig_pairs_json }}
        run: |
          set -euo pipefail

          # GHCR/Docker repository names must be lowercase.
          image_repo_lower="$(printf '%s' "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')"

          mapfile -t imageconfig_pairs < <(python3 - <<'PY'
          import json
          import os

          pairs = json.loads(os.environ["IMAGECONFIG_PAIRS_JSON"])
          for pair in pairs:
              print(f"{pair['tenant']}|{pair['imageconfig']}")
          PY
          )

          for pair in "${imageconfig_pairs[@]}"; do
            tenant="${pair%%|*}"
            imageconfig="${pair#*|}"
            tenant_lower="$(printf '%s' "${tenant}" | tr '[:upper:]' '[:lower:]')"

            if [[ -z "${tenant}" || -z "${imageconfig}" ]]; then
              echo "Invalid tenant/imageconfig pair: ${pair}" >&2
              exit 1
            fi

            policies_root="${CONFIGS_DIR}/${tenant}/${POLICIES_DIR}"
            assets_root="${CONFIGS_DIR}/${tenant}/${ASSETS_DIR}"
            image_id="$(python3 -c 'import sys, yaml; print((yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {}).get("image_id", ""))' "${imageconfig}")"
            if [[ -z "${image_id}" ]]; then
              echo "Missing required image_id in imageconfig: ${imageconfig}" >&2
              exit 1
            fi
            image_id_lower="$(printf '%s' "${image_id}" | tr '[:upper:]' '[:lower:]')"

            target_image_ref="${image_repo_lower}/${tenant_lower}/${image_id_lower}:latest"
            ./scripts/build-image.sh "${imageconfig}" "${policies_root}" "${assets_root}" "${target_image_ref}"
          done

      