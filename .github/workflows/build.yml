name: Build device group images

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Optional tenant folder name (for example bibliotek)
        required: false
        type: string
      imageconfig_file:
        description: Optional imageconfig filename or path to build (for example boernebibliotek.yml or config/bibliotek/imageconfigs/boernebibliotek.yml)
        required: false
        type: string

env:
  # Base container image used for schema validation and as build FROM image.
  BASE_IMAGE: ghcr.io/os2borgerpc/sikker-selvbetjening:latest
  # Registry/repository prefix where derived images are tagged and pushed.
  IMAGE_REPO: ghcr.io/os2borgerpc/sikker-selvbetjening-config

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install ansible pyyaml

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Discover tenants
        id: discover_tenants
        run: |
          set -euo pipefail

          mapfile -t tenants < <(find config -mindepth 1 -maxdepth 1 -type d | sort)

          if [[ "${#tenants[@]}" -eq 0 ]]; then
            echo "No tenant folders found under config/" >&2
            exit 1
          fi

          tenants_json="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "${tenants[@]}")"
          echo "tenants_json=${tenants_json}" >> "$GITHUB_OUTPUT"

          echo "Discovered tenants:" >> "$GITHUB_STEP_SUMMARY"
          for tenant in "${tenants[@]}"; do
            echo "- ${tenant}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo >> "$GITHUB_STEP_SUMMARY"

      