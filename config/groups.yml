domains:
  - domain: demo
    groups:
      - name: new-group
      - name: nordborg
        desktop:
          background_image_file: config/assets/demo/Smartphone_Hand_shutterstock_300357755.png
        printer:
          default_printer: ricoh_c3010
          with_ppd:
            - name: ricoh_c3010
              display_name: P11567 - Ricoh C3010
              protocol: socket
              ip: 10.1.1.30
              ppd_file: config/assets/demo/Ricoh-IM_C3010-PDF-Ricoh.ppd
              settings:
                page_size: A4
                color_mode: rgb
                duplex: none
                orientation: portrait
        wifi:
          ssid: nordborg
    build_targets: []
