domains:
  - domain: demo
    policies:
      - name: nordborg
        desktop:
          background_image_file: config/assets/demo/jura.png
        printer:
          printers:
            - name: ricoh_c3010
              printer-type: with_ppd
              display_name: P11567 - Ricoh C3010
              protocol: socket
              ip: 10.1.1.30
              ppd_file: config/assets/demo/Ricoh-IM_C3010-PDF-Ricoh.ppd
              is_default: true
              settings:
                page_size: A4
                color_mode: rgb
                duplex: none
                orientation: portrait
        wifi:
          ssid: borgernet   # Required
          psk: ""           # Optional (can be left empty)
          hidden: false     # Optional (can be left empty)
        favorite_apps:
          apps:
            - org.gnome.Nautilus.desktop
            - org.mozilla.firefox.desktop
            - logout-button.desktop
        firefox_urls:
          urls:
            - https://os2borgerpc.os2.eu/
        mesh_agent:
          url: https://sikkerselvbetjening.org/demo/
          groupid: Sv6lSHK2gWTOr%40kd7qG1xGvtbTp%24qVsAcdzyWbUJmxcWBqz2M%404e1uDEUCGdJiug
    device_groups:
      - name: Nordborg
        description: Build image for Nordborg
        policies:
          - nordborg
        image_name: nordborg
